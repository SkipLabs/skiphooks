name: Deploy to Clever Cloud

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: skiphooks_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      POSTGRESQL_ADDON_URI: postgresql://postgres:test@localhost:5432/skiphooks_test
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install

      - name: Migrate test database
        run: bun run db:migrate

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bash scripts/test.sh

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Push to Clever Cloud
        env:
          CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
          CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
          CLEVER_GIT_URL: ${{ secrets.CLEVER_GIT_URL }}
        run: |
          CLEVER_HOST=$(echo "$CLEVER_GIT_URL" | sed 's|https://||' | cut -d'/' -f1)
          git credential-store --file=/tmp/git-creds store <<EOF
          protocol=https
          host=${CLEVER_HOST}
          username=${CLEVER_TOKEN}
          password=${CLEVER_SECRET}

          EOF
          git config credential.helper "store --file=/tmp/git-creds"
          git push "${CLEVER_GIT_URL}" main:master --force
